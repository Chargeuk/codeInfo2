codeinfo_provider = "codex"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode    = "danger-full-access"
web_search_mode = "live"
personality = "friendly"

[features]
view_image_tool = true

[mcp_servers]
[mcp_servers.context7]
args = ['-y', '@upstash/context7-mcp', '--api-key', 'REPLACE_WITH_CONTEXT7_API_KEY']
command = 'npx'
startup_timeout_sec = 20.0

[mcp_servers.mui]
args = ['-y', '@mui/mcp@latest']
command = 'npx'

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"
startup_timeout_sec = 20.0

[mcp_servers.code_info]
command = "npx"
args    = ["-y", "mcp-remote", "http://localhost:${CODEINFO_CHAT_MCP_PORT}/mcp", "--allow-http"]
startup_timeout_sec = 60
tool_timeout_sec = 1800

[mcp_servers.playwright]
command = "npx"
args    = ["-y", "mcp-remote", "CODEINFO_PLAYWRIGHT_MCP_URL", "--allow-http"]
startup_timeout_sec = 60
tool_timeout_sec = 180

[mcp_servers."chrome-devtools"]
command = "npx"
args = [
"-y",
"chrome-devtools-mcp@latest",
"--browser-url=http://localhost:9222"
]
startup_timeout_sec = 20

# Bearer tokens are supplied from server/.env.local at runtime.
[mcp_servers.gravitee_local]
command = "node"
args = [
  "/home/dastapleton/code/gravitee-apim-mcp-server/bin/mcp-server.js",
  "start",
  "--bearer-auth",
  "${CODEINFO_GRAVITEE_LOCAL_BEARER_TOKEN}",
  "--server-url",
  "http://localhost:8083/management/v2"
]
startup_timeout_sec = 60
tool_timeout_sec = 300

[mcp_servers.gravitee_dev]
command = "node"
args = [
  "/home/dastapleton/code/gravitee-apim-mcp-server/bin/mcp-server.js",
  "start",
  "--bearer-auth",
  "${CODEINFO_GRAVITEE_DEV_BEARER_TOKEN}",
  "--server-url",
  "https://org-marex.eu.ba813.api.gravitee.io/management/v2"
]
startup_timeout_sec = 60
tool_timeout_sec = 300

[projects]
[projects."/data"]
trust_level = "trusted"

[projects."/app/server"]
trust_level = "trusted"
