model = "gpt-5.4"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode    = "danger-full-access"
web_search_mode = "live" 

[features]
view_image_tool = true

[mcp_servers]
[mcp_servers.context7]
args = ['-y', '@upstash/context7-mcp', '--api-key', 'REPLACE_WITH_CONTEXT7_API_KEY']
command = 'npx'
startup_timeout_sec = 20.0

[mcp_servers.mui]
args = ['-y', '@mui/mcp@latest']
command = 'npx'

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"
startup_timeout_sec = 20.0

[mcp_servers.code_info]
command = "npx"
args    = ["-y", "mcp-remote", "http://localhost:${CODEINFO_CHAT_MCP_PORT}/mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 1800

[mcp_servers.gravitee_local]
command = "node"
args = [
  "/home/dastapleton/code/gravitee-apim-mcp-server/bin/mcp-server.js",
  "start",
  "--bearer-auth",
  "ed502349-82b5-421b-9023-4982b5921b9a",
  "--server-url",
  "http://localhost:8083/management/v2"
]
startup_timeout_sec = 60
tool_timeout_sec = 300

[mcp_servers.gravitee_dev]
command = "node"
args = [
  "/home/dastapleton/code/gravitee-apim-mcp-server/bin/mcp-server.js",
  "start",
  "--bearer-auth",
  "4ea9bf01-0a74-43f1-a9bf-010a7483f13b",
  "--server-url",
  "https://org-marex.eu.ba813.api.gravitee.io/management/v2"
]
startup_timeout_sec = 60
tool_timeout_sec = 300

[projects]
[projects."/data"]
trust_level = "trusted"

[projects."/app/server"]
trust_level = "trusted"
